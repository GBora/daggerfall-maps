<main class="mt-3 container mx-auto">
  <div>
    <div class="card m-3 mx-auto form-card">
      <div class="card-body">
        <form>
          <div class="mb-3 row">
            <div class="col-4 custom-label">Region</div>
            <div class="col-8">
              <ng-select
                class="ng-select bootstrap"
                [items]="availableRegions"
                [multiple]="false"
                [closeOnSelect]="true"
                [searchable]="true"
                name="selectedRegion"
                [(ngModel)]="selectedRegion"
                (change)="findMatches($event)">
              </ng-select>
            </div>
          </div>

          <div class="mb-3 row">
            <div class="col-4 custom-label">Service</div>
            <div class="col-8">
              <ng-select
                class="ng-select bootstrap"
                [items]="availableServices"
                [multiple]="true"
                [closeOnSelect]="false"
                [searchable]="true"
                name="desiredService"
                [(ngModel)]="desiredServices"
                (change)="findMatches($event)">
              </ng-select>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>

  <div *ngIf="selectedRegion && desiredServices" class="row mt-5">
    <div class="card m-3 res-card" *ngFor="let city of this.matchingCities">
      <div class="card-body">
        <h5 class="card-title text-center">{{ city.name }}</h5>
        <p class="card-text">Services:</p>
        <p class="card-text">{{ this.beautifyServiceCodes(city.serviceCodes) }}</p>
      </div>
    </div>
    <div *ngIf="matchingCities.length === 0 && this.selectedRegion && this.desiredServices.length"
         class="text-bg-warning p-2 mx-auto res-card">
      No matches found
    </div>
  </div>
</main>
